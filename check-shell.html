<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="zh-cn/tech.html" style="width:1280px;height:900px"></iframe>
<pre id="out">loading...</pre>
<script>
var f = document.getElementById('f');
f.onload = function() {
  var d = f.contentDocument;
  var st = d.createElement('style');
  st.textContent = '*{animation:none !important;transition:none !important}';
  d.head.appendChild(st);
  setTimeout(function() {
    var cs = d.defaultView.getComputedStyle;
    var card = d.querySelector('.projects-shell .section-card');
    var ctc = d.querySelector('.projects-shell .content-text-card');
    var out = document.getElementById('out');
    out.textContent = JSON.stringify({
      sectionCard背景: cs(card).backgroundColor,
      contentTextCard背景: cs(ctc).backgroundColor,
      shell背景层数: cs(d.querySelector('.projects-shell')).backgroundImage.split('gradient(').length - 1
    }, null, 1);
  }, 2500);
};
</script>
</body></html>
