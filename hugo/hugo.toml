baseURL = "https://www.fengyuwang.com/"
title = "Fengyu WANG"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = true
buildFuture = true
publishDir = "../_site"
[pagination]
pagerSize = 12

disableKinds = ["home", "sitemap", "robotsTXT", "404"]

[languages]
  [languages.zh-cn]
    languageCode = "zh-CN"
    languageName = "简体中文"
    weight = 1
    contentDir = "content/zh-cn"
  [languages.zh-hk]
    languageCode = "zh-HK"
    languageName = "繁體中文"
    weight = 2
    contentDir = "content/zh-hk"
  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 3
    contentDir = "content/en"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  section = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  home = ["HTML"]

[outputFormats.RSS]
  mediatype = "application/rss"
  baseName = "index"
# 相关阅读：按题材相关度排序（标签+标题+正文词频），取代旧"同标签取最新3篇"的时间序
[related]
  threshold = 0
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "title"
    weight = 60
  [[related.indices]]
    name = "text"
    weight = 40
