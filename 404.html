<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Page not found | Fengyu WANG</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 52%, #e0f2fe 100%);
      color: #0f172a;
    }
    .card {
      width: min(680px, 100%);
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(15,23,42,.08);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(15,23,42,.12);
      padding: 32px;
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { margin: 0 0 16px; color: #475569; line-height: 1.7; }
    .links { display: grid; gap: 12px; }
    .links a {
      display: block;
      padding: 14px 16px;
      border-radius: 14px;
      background: #0f172a;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      text-align: center;
    }
  </style>
  <style>/* Standalone page: loads no shared CSS, keep back-to-top styles inline */.back-to-top{position:fixed;bottom:30px;right:30px;width:48px;height:48px;border-radius:50%;background:#0071e3;color:#fff;border:none;box-shadow:0 8px 24px rgba(0,113,227,.3);cursor:pointer;font-size:20px;display:none;align-items:center;justify-content:center;z-index:999;transition:opacity .2s}.back-to-top.show{display:flex}.back-to-top:hover{background:#0062cc}
    body[data-theme="dark"] {
      background: #0a0e1a;
      color: #f5f5f7;
    }
    body[data-theme="dark"] .card {
      background: rgba(20,25,40,.94);
      border-color: rgba(245,245,247,.1);
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    body[data-theme="dark"] p { color: #86868b; }
    body[data-theme="dark"] .links a { background: #2997ff; color: #fff; }
    body[data-theme="dark"] .back-to-top {
      background: #4f7eff;
      box-shadow: 0 8px 24px rgba(79,126,255,.3);
    }
    body[data-theme="dark"] .back-to-top:hover { background: #3d6aef; }
  </style>
  <script>
    (function () {
      var routes = {"en":["about.html","capabilities.html","cases.html","contact.html","index.html","invest.html","mkt.html","tech.html","services.html"],"zh-cn":["about.html","capabilities.html","cases.html","contact.html","index.html","invest.html","mkt.html","tech.html","services.html"],"zh-hk":["about.html","capabilities.html","cases.html","contact.html","index.html","invest.html","mkt.html","tech.html","services.html"]};
      var lang = (navigator.language || '').toLowerCase();
      var preferred = 'en';
      if (lang.indexOf('zh-hk') === 0 || lang.indexOf('zh-tw') === 0 || lang.indexOf('zh-hant') === 0) {
        preferred = 'zh-hk';
      } else if (lang.indexOf('zh') === 0) {
        preferred = 'zh-cn';
      }

      function resolveTarget(pathname) {
        var clean = pathname.replace(/^\/+|\/+$/g, '');
        if (!clean || clean === '404.html') return '/' + preferred + '/index.html';
        if (clean.startsWith('en/') || clean.startsWith('zh-cn/') || clean.startsWith('zh-hk/')) return '/' + clean;

        // Blog paths: redirect to the blog listing in the preferred language
        if (clean.indexOf('blog/') !== -1) {
          return '/' + preferred + '/blog/';
        }

        var candidates = [];
        if (clean.endsWith('.html')) {
          candidates.push(clean);
        } else {
          candidates.push(clean + '.html');
          candidates.push(clean + '/index.html');
        }

        for (var i = 0; i < candidates.length; i++) {
          if (routes[preferred].indexOf(candidates[i]) !== -1) {
            return '/' + preferred + '/' + candidates[i];
          }
        }
        return '/' + preferred + '/index.html';
      }

      window.location.replace(resolveTarget(window.location.pathname));
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist. Choose your language to continue:</p>
    <div class="links">
      <a href="/en/index.html">English</a>
      <a href="/zh-cn/index.html">&#31616;&#20307;&#20013;&#25991;</a>
      <a href="/zh-hk/index.html">&#32321;&#39636;&#20013;&#25991;</a>
    </div>
  </div>

    <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#x2191;</button>
    <script>(function(){var btn=document.getElementById('backToTop');if(!btn)return;window.addEventListener('scroll',function(){btn.classList.toggle('show',window.scrollY>300)},{passive:true});})();</script>
</body>
</html>
